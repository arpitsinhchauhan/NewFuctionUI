<div class="card-premium dialog-modern-card dialog-sm">
  <div class="card-header-modern">
    <div class="header-text">
      <h4 class="card-title">
        <mat-icon class="me-2 text-primary">lock_reset</mat-icon>
        Update Password
      </h4>
      <p class="card-subtitle">Ensure your account stays secure</p>
    </div>
    <button mat-icon-button (click)="close()" class="close-btn" color="warn">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="card-body p-4">
    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
      <div class="row g-3">
        <div class="col-md-12">
          <div class="form-group-modern">
            <label class="label-modern">Current Password</label>
            <mat-form-field appearance="outline" class="w-100">
              <mat-icon matPrefix class="me-2 opacity-50">vpk_key</mat-icon>
              <input matInput [type]="hideOld ? 'password' : 'text'" formControlName="oldPassword" placeholder="Enter old password">
              <button mat-icon-button matSuffix (click)="hideOld = !hideOld" type="button" class="opacity-50">
                <mat-icon>{{hideOld ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
              <mat-error *ngIf="submitted && f.oldPassword.errors?.required">Required</mat-error>
            </mat-form-field>
          </div>
        </div>

        <div class="col-md-12">
          <div class="form-group-modern">
            <label class="label-modern">New Password</label>
            <mat-form-field appearance="outline" class="w-100">
              <mat-icon matPrefix class="me-2 opacity-50">security</mat-icon>
              <input matInput [type]="hideNew ? 'password' : 'text'" formControlName="newPassword" placeholder="Minimum 8 characters">
              <button mat-icon-button matSuffix (click)="hideNew = !hideNew" type="button" class="opacity-50">
                <mat-icon>{{hideNew ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
              <mat-error *ngIf="submitted && f.newPassword.errors?.required">Required</mat-error>
            </mat-form-field>
          </div>
        </div>

        <div class="col-md-12">
          <div class="form-group-modern">
            <label class="label-modern">Confirm New Password</label>
            <mat-form-field appearance="outline" class="w-100">
              <mat-icon matPrefix class="me-2 opacity-50">verified_user</mat-icon>
              <input matInput [type]="hideConfirm ? 'password' : 'text'" formControlName="confirmPassword" placeholder="Repeat new password">
              <button mat-icon-button matSuffix (click)="hideConfirm = !hideConfirm" type="button" class="opacity-50">
                <mat-icon>{{hideConfirm ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
              <mat-error *ngIf="submitted && f.confirmPassword.errors?.required">Required</mat-error>
              <mat-error *ngIf="submitted && changePasswordForm.errors?.passwordMismatch">Passwords do not match</mat-error>
            </mat-form-field>
          </div>
        </div>
      </div>

      <div class="dialog-actions-modern mt-4">
        <button mat-stroked-button type="button" (click)="close()" class="px-4 py-2 me-auto">
          Cancel
        </button>
        <button mat-flat-button color="primary" type="submit" class="px-5 py-2">
          <mat-icon class="me-2">check_circle</mat-icon> Update Password
        </button>
      </div>
    </form>
  </div>
</div>
