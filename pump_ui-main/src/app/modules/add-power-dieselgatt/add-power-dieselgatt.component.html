<div class="dialog-modern-container dialog-md">
  <div class="dialog-header-modern">
    <div class="header-main">
      <h4>
        <mat-icon class="me-2 text-primary vertical-align-middle">local_shipping</mat-icon>
        Power Diesel Gatt Entry
      </h4>
      <span class="dialog-type-badge badge-add ms-3">Stock Loss</span>
    </div>
    <button mat-icon-button (click)="cancel()" class="text-muted" title="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-content-modern p-4">
    <form [formGroup]="PowerDieselForm">
      <div class="form-grid-modern">
        <div class="form-group-modern">
          <label class="form-label-modern text-muted mb-1">Entry Date</label>
          <input type="date" class="form-control-modern" formControlName="date">
        </div>

        <div class="form-group-modern">
          <label class="form-label-modern text-muted mb-1">Power Diesel Gatt (Ltrs)</label>
          <input type="number" class="form-control-modern font-weight-bold" formControlName="powerDieselgatt" placeholder="0.00">
        </div>
      </div>
    </form>
  </div>

  <div class="dialog-actions-modern mt-2">
    <button class="btn-premium btn-premium-secondary px-4" (click)="cancel()">
      Cancel
    </button>
    <button class="btn-premium btn-premium-primary px-5" (click)="onSubmit()">
      <mat-icon class="me-2">check</mat-icon> Submit Record
    </button>
  </div>
</div>
