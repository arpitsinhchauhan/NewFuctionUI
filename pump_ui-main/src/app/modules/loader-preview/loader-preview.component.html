<div class="main-content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <div class="card card-premium">
          <div class="card-header-modern">
            <h4 class="card-title">
              <mat-icon class="me-2">design_services</mat-icon> CSS Loader Output Gallery
            </h4>
            <p class="card-subtitle">Live preview of minimalist dots & bars animations</p>
          </div>
          <div class="card-body">
            <div class="row g-4 text-center">
              
              <!-- Option 1 -->
              <div class="col-md-3">
                <div class="loader-preview-box">
                  <div class="fuel-line"></div>
                  <h6>Option 1: Fuel Line</h6>
                  <button mat-stroked-button color="primary" (click)="setLoader(1)">Apply This</button>
                </div>
              </div>

              <!-- Option 2 -->
              <div class="col-md-3">
                <div class="loader-preview-box">
                  <div class="tank-meters"></div>
                  <h6>Option 2: Tank Meters</h6>
                  <button mat-stroked-button color="primary" (click)="setLoader(2)">Apply This</button>
                </div>
              </div>

              <!-- Option 3 -->
              <div class="col-md-3">
                <div class="loader-preview-box">
                  <div class="volume-pulse"></div>
                  <h6>Option 3: Volume Pulse</h6>
                  <button mat-stroked-button color="primary" (click)="setLoader(3)">Apply This</button>
                </div>
              </div>

              <!-- Option 4 -->
              <div class="col-md-3">
                <div class="loader-preview-box">
                  <div class="liquid-fill"></div>
                  <h6>Option 4: Liquid Fill</h6>
                  <button mat-stroked-button color="primary" (click)="setLoader(4)">Apply This</button>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
