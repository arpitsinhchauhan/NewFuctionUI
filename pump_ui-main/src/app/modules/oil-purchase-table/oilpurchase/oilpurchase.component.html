<div class="card-premium dialog-modern-card p-0 overflow-hidden" style="max-height: 90vh; display: flex; flex-direction: column;">
  <!-- Header -->
  <div class="card-header-modern d-flex justify-content-between align-items-center p-3 border-bottom bg-light">
    <div>
      <h4 class="card-title-modern m-0 font-weight-bold text-dark d-flex align-items-center gap-2">
        <mat-icon class="text-warning">oil_barrel</mat-icon>
        Oil Purchase Entry
      </h4>
      <small class="text-muted">Record multiple lubricant oil purchases on the same business date</small>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button type="button" class="btn btn-sm btn-outline-warning d-flex align-items-center gap-1 font-weight-bold" (click)="addTable()">
        <mat-icon style="font-size: 16px; width: 16px; height: 16px;">add</mat-icon> + Add Purchase
      </button>
      <button mat-icon-button type="button" (click)="cancel()" class="btn-close-custom">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <div class="card-body p-3 overflow-auto" style="flex: 1 1 auto;">
    <!-- Date picker row -->
    <div class="row align-items-center mb-3">
      <div class="col-md-4">
        <label class="form-label font-weight-bold text-secondary mb-1">Purchase Date</label>
        <input type="date" class="form-control modern-date-input" [(ngModel)]="purchaseDate" (change)="updateDate()">
      </div>
    </div>

    <!-- Multi Oil Purchase Cards / Rows -->
    <div *ngFor="let item of row; let i = index" class="card mb-3 border shadow-sm">
      <div class="card-header bg-white d-flex justify-content-between align-items-center py-2 px-3 border-bottom">
        <span class="badge badge-warning px-2 py-1 font-weight-bold" style="font-size: 13px; background: #fef3c7; color: #92400e;">
          Oil Purchase #{{ i + 1 }}
        </span>
        <button *ngIf="row.length > 1" type="button" class="btn btn-sm btn-outline-danger py-0 px-2" (click)="deleteRow(i)">
          <mat-icon style="font-size: 14px; width: 14px; height: 14px; vertical-align: middle;">delete</mat-icon> Remove
        </button>
      </div>
      <div class="card-body p-3 bg-light">
        <!-- Row 1: Item Details -->
        <div class="row g-2 mb-2">
          <div class="col-md-3">
            <label class="small text-muted mb-0 font-weight-bold">Vendor Name</label>
            <input type="text" [(ngModel)]="item.vendorName" class="form-control form-control-sm" placeholder="e.g. Servo / Castrol">
          </div>
          <div class="col-md-3">
            <label class="small text-muted mb-0 font-weight-bold">SKU Name</label>
            <input type="text" [(ngModel)]="item.skuName" class="form-control form-control-sm" placeholder="e.g. 15W40 Engine Oil">
          </div>
          <div class="col-md-2">
            <label class="small text-muted mb-0 font-weight-bold">SKU #</label>
            <input type="text" [(ngModel)]="item.skuNumber" class="form-control form-control-sm" placeholder="SKU-001">
          </div>
          <div class="col-md-2">
            <label class="small text-muted mb-0 font-weight-bold">HSN Code</label>
            <input type="text" [(ngModel)]="item.hsn" class="form-control form-control-sm" placeholder="2710">
          </div>
          <div class="col-md-2">
            <label class="small text-muted mb-0 font-weight-bold">Unit</label>
            <input type="text" [(ngModel)]="item.unit" class="form-control form-control-sm" placeholder="e.g. Ltr/Can/Brl">
          </div>
        </div>

        <!-- Row 2: Quantity & Rate -->
        <div class="row g-2 mb-2">
          <div class="col-md-2">
            <label class="small text-muted mb-0 font-weight-bold text-primary">Quantity (Qty) *</label>
            <input type="number" [(ngModel)]="item.quantity" (input)="calculateRow(item)" class="form-control form-control-sm text-right font-weight-bold no-spinner" placeholder="0">
          </div>
          <div class="col-md-2">
            <label class="small text-muted mb-0 font-weight-bold">Qty (Ltr/Kg)</label>
            <input type="number" [(ngModel)]="item.qtyLtrOrKg" class="form-control form-control-sm text-right no-spinner" placeholder="0.00">
          </div>
          <div class="col-md-2">
            <label class="small text-muted mb-0 font-weight-bold">MRP (₹)</label>
            <input type="number" [(ngModel)]="item.mrp" class="form-control form-control-sm text-right no-spinner" placeholder="0.00">
          </div>
          <div class="col-md-2">
            <label class="small text-muted mb-0 font-weight-bold">Rate (₹) *</label>
            <input type="number" [(ngModel)]="item.rate" (input)="calculateRow(item)" class="form-control form-control-sm text-right no-spinner" placeholder="0.00">
          </div>
          <div class="col-md-2">
            <label class="small text-muted mb-0 font-weight-bold">Net Total (₹)</label>
            <input type="number" [(ngModel)]="item.netTotal" class="form-control form-control-sm text-right bg-white" readonly placeholder="0.00">
          </div>
          <div class="col-md-2">
            <label class="small text-muted mb-0 font-weight-bold">Discount (₹)</label>
            <input type="number" [(ngModel)]="item.discount" (input)="calculateRow(item)" class="form-control form-control-sm text-right no-spinner" placeholder="0.00">
          </div>
        </div>

        <!-- Row 3: Tax & Net Amount -->
        <div class="row g-2">
          <div class="col-md-2">
            <label class="small text-muted mb-0 font-weight-bold">Taxable Value (₹)</label>
            <input type="number" [(ngModel)]="item.taxableValue" class="form-control form-control-sm text-right bg-white" readonly placeholder="0.00">
          </div>
          <div class="col-md-2">
            <label class="small text-muted mb-0 font-weight-bold">GST %</label>
            <input type="number" [(ngModel)]="item.gstPercentage" (input)="calculateRow(item)" class="form-control form-control-sm text-right no-spinner" placeholder="18">
          </div>
          <div class="col-md-2">
            <label class="small text-muted mb-0 font-weight-bold">GST Amount (₹)</label>
            <input type="number" [(ngModel)]="item.gstAmount" class="form-control form-control-sm text-right bg-white" readonly placeholder="0.00">
          </div>
          <div class="col-md-2">
            <label class="small text-muted mb-0 font-weight-bold">Cess %</label>
            <input type="number" [(ngModel)]="item.cessPercentage" (input)="calculateRow(item)" class="form-control form-control-sm text-right no-spinner" placeholder="0">
          </div>
          <div class="col-md-2">
            <label class="small text-muted mb-0 font-weight-bold">Cess Amount (₹)</label>
            <input type="number" [(ngModel)]="item.cessAmount" class="form-control form-control-sm text-right bg-white" readonly placeholder="0.00">
          </div>
          <div class="col-md-2">
            <label class="small text-muted mb-0 font-weight-bold text-success">Net Amount (₹)</label>
            <input type="number" [(ngModel)]="item.netAmount" class="form-control form-control-sm text-right font-weight-bold text-success bg-white" readonly placeholder="0.00">
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Add Purchase Button at bottom of list -->
    <div class="text-center my-3">
      <button type="button" class="btn btn-outline-warning font-weight-bold px-4 d-inline-flex align-items-center gap-1" (click)="addTable()">
        <mat-icon style="font-size: 18px; width: 18px; height: 18px;">add</mat-icon> + Add Another Oil Purchase
      </button>
    </div>
  </div>

  <!-- Footer Total & Actions -->
  <div class="d-flex justify-content-between align-items-center p-3 border-top bg-light">
    <div class="grand-total-box px-3 py-2 bg-white border rounded">
      <span class="text-muted font-weight-bold mr-2">Grand Total Oil Purchase:</span>
      <span class="h5 font-weight-bold text-success mb-0">₹{{ totalPrice() | number:'1.2-2' }}</span>
    </div>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-outline-secondary px-4 mr-2" (click)="cancel()">Cancel</button>
      <button type="button" class="btn btn-primary px-4 d-flex align-items-center gap-1" (click)="order()">
        <mat-icon class="mr-1">save</mat-icon> Save Purchases
      </button>
    </div>
  </div>
</div>
