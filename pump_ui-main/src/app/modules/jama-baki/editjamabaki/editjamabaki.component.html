<div class="dialog-modern-container dialog-md">
  <div class="dialog-header-modern">
    <div class="header-main">
      <h4>
        <mat-icon class="text-primary me-2">account_balance_wallet</mat-icon>
        Edit Jama & Baki Details
      </h4>
      <span class="dialog-type-badge badge-edit ms-3">Update Mode</span>
    </div>
    <button mat-icon-button (click)="cancel()" class="text-muted" title="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-content-modern p-4">
    <div class="row g-3">
      <div class="col-md-6">
        <div class="form-group-modern">
          <label class="form-label-modern text-muted mb-1">Transaction Date</label>
          <mat-form-field appearance="outline" class="w-100 density-compact">
            <input matInput type="date" [(ngModel)]="data.date">
          </mat-form-field>
        </div>
      </div>

      <div class="col-md-6">
        <div class="form-group-modern">
          <label class="form-label-modern text-muted mb-1">Customer Name</label>
          <mat-form-field appearance="outline" class="w-100 density-compact">
            <mat-icon matPrefix class="me-2 text-muted">person</mat-icon>
            <input matInput type="text" [(ngModel)]="data.name" placeholder="Enter name">
          </mat-form-field>
        </div>
      </div>

      <div class="col-md-6">
        <div class="form-group-modern">
          <label class="form-label-modern text-muted mb-1">Jama (Credit Amount)</label>
          <mat-form-field appearance="outline" class="w-100 density-compact">
            <mat-icon matPrefix class="me-2 text-success">add_circle_outline</mat-icon>
            <input matInput type="number" [(ngModel)]="data.jama" placeholder="0.00" class="text-success font-weight-bold">
          </mat-form-field>
        </div>
      </div>

      <div class="col-md-6">
        <div class="form-group-modern">
          <label class="form-label-modern text-muted mb-1">Jama Note</label>
          <mat-form-field appearance="outline" class="w-100 density-compact">
            <mat-icon matPrefix class="me-2 text-muted">description</mat-icon>
            <input matInput type="text" [(ngModel)]="data.jamaNote" placeholder="Credit reason...">
          </mat-form-field>
        </div>
      </div>

      <div class="col-md-6">
        <div class="form-group-modern">
          <label class="form-label-modern text-muted mb-1">Baki (Debit Amount)</label>
          <mat-form-field appearance="outline" class="w-100 density-compact">
            <mat-icon matPrefix class="me-2 text-danger">remove_circle_outline</mat-icon>
            <input matInput type="number" [(ngModel)]="data.baki" placeholder="0.00" class="text-danger font-weight-bold">
          </mat-form-field>
        </div>
      </div>

      <div class="col-md-6">
        <div class="form-group-modern">
          <label class="form-label-modern text-muted mb-1">Baki Note</label>
          <mat-form-field appearance="outline" class="w-100 density-compact">
            <mat-icon matPrefix class="me-2 text-muted">description</mat-icon>
            <input matInput type="text" [(ngModel)]="data.bakiNote" placeholder="Debit reason...">
          </mat-form-field>
        </div>
      </div>
    </div>
  </div>

  <div class="dialog-actions-modern mt-2">
    <button class="btn-premium btn-premium-secondary px-4" (click)="cancel()">
      Cancel
    </button>
    <button class="btn-premium btn-premium-primary px-5" (click)="Edit()">
      <mat-icon class="me-2">save</mat-icon> Update Records
    </button>
  </div>
</div>
