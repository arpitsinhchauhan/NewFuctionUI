<div class="dialog-modern-container" style="width: 800px;">
  <div class="dialog-header-modern">
    <div class="header-main">
      <h4>
        <mat-icon class="me-2 vertical-align-middle">add_business</mat-icon>
        Edit Extra Purchase
      </h4>
    </div>
    <button mat-icon-button (click)="cancel()" class="text-white">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-content-modern">
    <div class="form-grid-modern">
      <div class="form-group-modern">
        <label class="form-label-modern">Purchase Date</label>
        <input type="date" class="form-control-modern" [(ngModel)]="extraPurchaseDetails.date">
      </div>

      <div class="form-group-modern">
        <label class="form-label-modern">Purchase Type</label>
        <select class="form-control-modern" [(ngModel)]="extraPurchaseDetails.extraType">
          <option value="XP Petrol">XP Petrol</option>
          <option value="Power Diesel">Power Diesel</option>
        </select>
      </div>
    </div>

    <div class="form-grid-modern" style="grid-template-columns: 1fr 1fr 1fr;">
      <div class="form-group-modern">
        <label class="form-label-modern">Quantity</label>
        <input type="number" class="form-control-modern text-right" [(ngModel)]="extraPurchaseDetails.extra_quantity" placeholder="0.00">
      </div>

      <div class="form-group-modern">
        <label class="form-label-modern">Total Amount (₹)</label>
        <input type="number" class="form-control-modern text-right" [(ngModel)]="extraPurchaseDetails.extra_total" (input)="calculateTotalPurchase()" placeholder="0.00">
      </div>

      <div class="form-group-modern">
        <label class="form-label-modern">VAT (₹)</label>
        <input type="number" class="form-control-modern text-right" [(ngModel)]="extraPurchaseDetails.extra_vat" (input)="calculateTotalPurchase()" placeholder="0.00">
      </div>
    </div>

    <div class="form-grid-modern">
      <div class="form-group-modern">
        <label class="form-label-modern">Cess (₹)</label>
        <input type="number" class="form-control-modern text-right" [(ngModel)]="extraPurchaseDetails.extra_cess" (input)="calculateTotalPurchase()" placeholder="0.00">
      </div>

      <div class="form-group-modern">
        <label class="form-label-modern">JTC Percentage (%)</label>
        <input type="number" class="form-control-modern text-right" [(ngModel)]="extraPurchaseDetails.extra_jtcpercentage" (input)="calculateTotalPurchase()" placeholder="0.00">
      </div>
    </div>

    <!-- Summary Box -->
    <div class="valuation-box-modern">
      <div class="valuation-info">
        <span class="valuation-label">Total Purchase Amount</span>
        <div class="text-muted small">Comprehensive extra purchase valuation</div>
      </div>
      <div class="valuation-amount">
        ₹ {{ extraPurchaseDetails.extra_total_purchase | number:'1.2-2' }}
      </div>
    </div>
  </div>

  <div class="dialog-actions-modern">
    <button class="btn-premium btn-premium-secondary btn-md" (click)="cancel()">
      Cancel
    </button>
    <button class="btn-premium btn-premium-primary btn-md" *ngIf="data" (click)="Edit(extraPurchaseDetails)">
      <mat-icon class="me-2">save</mat-icon> 
      Update Purchase
    </button>
  </div>
</div>
