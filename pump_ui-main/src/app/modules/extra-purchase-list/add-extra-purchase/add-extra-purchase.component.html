<div class="card-premium dialog-modern-card p-0 overflow-hidden">
  <!-- Header -->
  <div class="card-header-modern d-flex justify-content-between align-items-center p-3 border-bottom bg-light">
    <div>
      <h4 class="card-title-modern m-0 font-weight-bold text-dark d-flex align-items-center gap-2">
        <mat-icon class="text-primary">local_gas_station</mat-icon>
        Extra Fuel Purchase Entry (XP & Power)
      </h4>
      <small class="text-muted">Register bulk XP Petrol and Power Diesel procurement details</small>
    </div>
    <button mat-icon-button type="button" (click)="cancel()" class="btn-close-custom">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="card-body p-3">
    <!-- Date picker row -->
    <div class="row align-items-center mb-3">
      <div class="col-md-5">
        <label class="form-label font-weight-bold text-secondary mb-1">Purchase Date</label>
        <input type="date" class="form-control modern-date-input" [(ngModel)]="extraDetails.date" (change)="updateDate()">
      </div>
    </div>

    <!-- Table -->
    <div class="table-responsive-modern border rounded">
      <table class="modern-report-table w-100">
        <thead>
          <tr>
            <th>Product Type</th>
            <th>Quantity (LTR)</th>
            <th>Base Total (₹)</th>
            <th>VAT (₹)</th>
            <th>Cess (₹)</th>
            <th>JTC %</th>
            <th class="text-right">Net Purchase (₹)</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of row; let i = index">
            <td class="font-weight-bold text-dark align-middle">{{ item.extraType }}</td>
            <td>
              <input type="number" [(ngModel)]="item.extra_quantity" class="report-input no-spinner text-right" [ngClass]="{'invalid-input': !isNumber(item.extra_quantity)}" placeholder="0.00" />
            </td>
            <td>
              <input type="number" [(ngModel)]="item.extra_total" class="report-input no-spinner text-right" [ngClass]="{'invalid-input': !isNumber(item.extra_total)}" placeholder="0.00" />
            </td>
            <td>
              <input type="number" [(ngModel)]="item.extra_vat" class="report-input no-spinner text-right" [ngClass]="{'invalid-input': !isNumber(item.extra_vat)}" placeholder="0.00" />
            </td>
            <td>
              <input type="number" [(ngModel)]="item.extra_cess" class="report-input no-spinner text-right" [ngClass]="{'invalid-input': !isNumber(item.extra_cess)}" placeholder="0.00" />
            </td>
            <td>
              <input type="number" [(ngModel)]="item.extra_jtcpercentage" class="report-input no-spinner text-right" [ngClass]="{'invalid-input': !isNumber(item.extra_jtcpercentage)}" placeholder="0.00" />
            </td>
            <td>
              <input type="number" [(ngModel)]="item.extra_total_purchase" class="report-input no-spinner text-right font-weight-bold text-success" [ngClass]="{'invalid-input': !isNumber(item.extra_total_purchase)}" placeholder="0.00" />
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Footer Total & Actions -->
    <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
      <div class="grand-total-box px-3 py-2 bg-light border rounded">
        <span class="text-muted font-weight-bold mr-2">Grand Total Purchase:</span>
        <span class="h5 font-weight-bold text-success mb-0">₹{{ totalPrice() | number:'1.2-2' }}</span>
      </div>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-secondary px-4 mr-2" (click)="cancel()">Cancel</button>
        <button type="button" class="btn btn-primary px-4 d-flex align-items-center gap-1" (click)="order()">
          <mat-icon class="mr-1">save</mat-icon> Save Extra Purchase
        </button>
      </div>
    </div>
  </div>
</div>
