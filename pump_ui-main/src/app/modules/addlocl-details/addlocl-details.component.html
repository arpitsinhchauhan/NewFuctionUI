<div class="locl-dialog-container">
  <!-- Header -->
  <div class="locl-header">
    <div class="header-title-group">
      <div class="header-icon-badge">
        <mat-icon>account_balance_wallet</mat-icon>
      </div>
      <div>
        <h3 class="dialog-title">LOCL Credit Details</h3>
        <p class="dialog-subtitle">Manage local credit balances and remarks</p>
      </div>
    </div>
    <div class="header-actions">
      <button mat-stroked-button color="primary" class="btn-credit-type" (click)="creditType()">
        <mat-icon class="btn-icon">add_circle_outline</mat-icon>
        <span>Credit Type</span>
      </button>
      <button mat-icon-button class="btn-close-dialog" (click)="cancel()" matTooltip="Close">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <!-- Body -->
  <div class="locl-body">
    <!-- Filter / Action Row -->
    <div class="control-bar">
      <div class="date-field-container">
        <label class="field-label">
          <mat-icon class="label-icon">event</mat-icon>
          Transaction Date
        </label>
        <div class="input-date-wrapper">
          <input type="date" class="custom-date-input" [(ngModel)]="purchaDipStockseDetails.date" (change)="getloclDetails()" />
        </div>
      </div>

      <button mat-flat-button color="primary" class="btn-add-row" (click)="addTable()">
        <mat-icon class="btn-icon">add</mat-icon>
        <span>Add New Row</span>
      </button>
    </div>

    <!-- Table Container -->
    <div class="table-wrapper">
      <table class="locl-table">
        <thead>
          <tr>
            <th style="width: 32%;">CREDIT TYPE</th>
            <th style="width: 25%;" class="text-right">BALANCE (₹)</th>
            <th style="width: 33%;">REMARK</th>
            <th style="width: 10%;" class="text-center">ACTION</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of row; let i = index" class="table-row">
            <td>
              <mat-form-field appearance="outline" class="cell-form-field">
                <mat-select placeholder="Select Credit Type" [(ngModel)]="item.credit" name="creditType{{ i }}">
                  <mat-option *ngFor="let type of creditTypeList" [value]="type">{{ type }}</mat-option>
                </mat-select>
              </mat-form-field>
            </td>
            <td>
              <mat-form-field appearance="outline" class="cell-form-field">
                <input matInput type="number" [(ngModel)]="item.balance" placeholder="0.00" class="text-right font-weight-semibold">
              </mat-form-field>
            </td>
            <td>
              <mat-form-field appearance="outline" class="cell-form-field">
                <input matInput type="text" [(ngModel)]="item.remark" placeholder="Enter remark...">
              </mat-form-field>
            </td>
            <td class="text-center">
              <button mat-icon-button color="warn" class="btn-delete-row" (click)="deleteRow(i)" matTooltip="Remove Row">
                <mat-icon>delete_outline</mat-icon>
              </button>
            </td>
          </tr>

          <!-- Empty State -->
          <tr *ngIf="row.length === 0">
            <td colspan="4">
              <div class="empty-state">
                <div class="empty-icon-wrapper">
                  <mat-icon>post_add</mat-icon>
                </div>
                <h5 class="empty-title">No rows added yet</h5>
                <p class="empty-desc">Click "Add New Row" to start adding credit entries for this date.</p>
                <button mat-stroked-button color="primary" class="btn-empty-add" (click)="addTable()">
                  <mat-icon>add</mat-icon> Add Row
                </button>
              </div>
            </td>
          </tr>
        </tbody>
        <tfoot *ngIf="row.length > 0">
          <tr class="footer-summary-row">
            <td colspan="2" class="text-right summary-label">Grand Total Balance:</td>
            <td colspan="2" class="summary-amount text-primary">
              ₹ {{ totalPrice() | number:'1.2-2' }}
            </td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <!-- Footer Actions -->
  <div class="locl-footer">
    <button mat-stroked-button (click)="cancel()" class="btn-cancel">
      Cancel
    </button>
    <button mat-flat-button color="primary" (click)="order()" class="btn-save">
      <mat-icon class="btn-icon">save</mat-icon>
      <span>Save Credit Details</span>
    </button>
  </div>
</div>
