<div class="report-entry-wrapper">
  <mat-card class="card-premium">
    <div class="card-header-modern">
      <div class="header-main">
        <h4 class="card-title-modern">Purchase Entry Record</h4>
        <p class="text-muted small mb-0">Record bulk fuel procurement and tax details</p>
      </div>
      <div class="header-actions">
        <button mat-icon-button (click)="cancel()" class="close-btn">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>

    <div class="card-body mt-4">
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Purchase Date</mat-label>
            <input matInput [(ngModel)]="purchaDipStockseDetails.date" type="date" (change)="updateDate()">
          </mat-form-field>
        </div>
        <div class="col-md-6 d-flex align-items-center justify-content-end">
          <button mat-flat-button color="primary" class="premium-btn-primary" (click)="order()">
            <mat-icon>add_shopping_cart</mat-icon>
            <span>Update Purchase Data</span>
          </button>
        </div>
      </div>

      <div class="table-responsive-modern">
        <table class="modern-table">
          <thead>
            <tr>
              <th>Product Type</th>
              <th>Quantity (Ltr)</th>
              <th>Base Total (₹)</th>
              <th>VAT (₹)</th>
              <th>Cess (₹)</th>
              <th>JTC %</th>
              <th class="text-right">Net Purchase (₹)</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of row; let i = index">
              <td>
                <span class="font-weight-bold text-primary">{{ item.type }}</span>
              </td>
              <td>
                <input type="number" [(ngModel)]="item.quantity"
                       class="table-input no-spinner" [ngClass]="{'invalid-input': !isNumber(item.quantity)}" />
              </td>
              <td>
                <input type="number" [(ngModel)]="item.total"
                       class="table-input no-spinner" [ngClass]="{'invalid-input': !isNumber(item.total)}" />
              </td>
              <td>
                <input type="number" [(ngModel)]="item.vat"
                       class="table-input no-spinner" [ngClass]="{'invalid-input': !isNumber(item.vat)}" />
              </td>
              <td>
                <input type="number" [(ngModel)]="item.cess"
                       class="table-input no-spinner" [ngClass]="{'invalid-input': !isNumber(item.cess)}" />
              </td>
              <td>
                <input type="number" [(ngModel)]="item.jtcpercentage"
                       class="table-input no-spinner" [ngClass]="{'invalid-input': !isNumber(item.jtcpercentage)}" />
              </td>
              <td class="text-right font-weight-bold text-success">
                ₹{{ item.total_purchase | number:'1.2-2' }}
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="card-footer-modern mt-4">
        <div class="grand-total-section">
          <span class="total-label">Grand Total Purchase:</span>
          <span class="total-value text-success">₹{{ totalPrice() | number:'1.2-2' }}</span>
        </div>
      </div>
    </div>
  </mat-card>
</div>
