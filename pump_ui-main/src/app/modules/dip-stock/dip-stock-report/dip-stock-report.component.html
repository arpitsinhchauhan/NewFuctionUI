<div class="dialog-modern-container dialog-md">
  <div class="dialog-header-modern">
    <div class="header-main">
      <h4>
        <mat-icon class="text-primary">straighten</mat-icon>
        Dip Inventory Details
      </h4>
    </div>
    <div class="header-actions">
      <button mat-icon-button (click)="openComponent()" matTooltip="View Dip Chart Table" class="text-primary">
        <mat-icon>table_chart</mat-icon>
      </button>
      <button mat-icon-button (click)="cancel()" class="text-muted">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <div class="dialog-content-modern">
    <div class="form-grid-modern">
      <div class="form-group-modern">
        <label class="form-label-modern">Inventory Date</label>
        <input type="date" class="form-control-modern" [(ngModel)]="purchaDipStockseDetails.date" name="date">
      </div>
    </div>

    <!-- Petrol Section -->
    <div class="section-divider mb-4">
      <span class="bg-card px-3 text-primary font-weight-bold d-flex align-items-center">
        <mat-icon class="me-2" style="font-size: 18px;">local_gas_station</mat-icon>
        PETROL TANK READINGS
      </span>
    </div>

    <div class="form-grid-modern">
      <div class="form-group-modern">
        <label class="form-label-modern">Dip Reading (mm)</label>
        <div class="d-flex align-items-center position-relative">
          <input type="number" class="form-control-modern text-right pe-5" [(ngModel)]="pdip" name="pdip" (blur)="fetchPvalue()"
            placeholder="0">
          <span class="position-absolute end-0 me-3 text-muted small">mm</span>
        </div>
      </div>
      <div class="form-group-modern">
        <label class="form-label-modern">Calculated Volume (Ltrs)</label>
        <div class="form-control-modern bg-light d-flex align-items-center justify-content-between">
          <mat-icon class="text-primary" style="font-size: 18px;">opacity</mat-icon>
          <span class="font-weight-bold text-primary">{{ pvalue | number:'1.2-2' }} L</span>
        </div>
      </div>
    </div>

    <!-- Diesel Section -->
    <div class="section-divider mb-4 mt-4">
      <span class="bg-card px-3 text-warning font-weight-bold d-flex align-items-center">
        <mat-icon class="me-2" style="font-size: 18px;">ev_station</mat-icon>
        DIESEL TANK READINGS
      </span>
    </div>

    <div class="form-grid-modern">
      <div class="form-group-modern">
        <label class="form-label-modern">Dip Reading (mm)</label>
        <div class="d-flex align-items-center position-relative">
          <input type="number" class="form-control-modern text-right pe-5" [(ngModel)]="dieseldip" name="dieseldip"
            (blur)="fetchDvalue()" placeholder="0">
          <span class="position-absolute end-0 me-3 text-muted small">mm</span>
        </div>
      </div>
      <div class="form-group-modern">
        <label class="form-label-modern">Calculated Volume (Ltrs)</label>
        <div class="form-control-modern bg-light d-flex align-items-center justify-content-between">
          <mat-icon class="text-warning" style="font-size: 18px;">opacity</mat-icon>
          <span class="font-weight-bold text-warning">{{ dvalue | number:'1.2-2' }} L</span>
        </div>
      </div>
    </div>
  </div>

  <div class="dialog-actions-modern">
    <button class="btn-premium btn-premium-secondary btn-md" (click)="cancel()">
      Cancel
    </button>
    <button class="btn-premium btn-premium-primary btn-md" *ngIf="data?.type === 'add'" (click)="logData()">
      <mat-icon class="me-2">add_circle</mat-icon>
      Add Inventory Record
    </button>
    <button class="btn-premium btn-premium-primary btn-md" *ngIf="data?.type === 'edit'"
      (click)="Edit(purchaDipStockseDetails)">
      <mat-icon class="me-2">save</mat-icon>
      Update Inventory Record
    </button>
  </div>
</div>
