<div class="user-master-wrapper">
  <div class="card-modern">
    <div class="card-header-modern">
      <div class="header-main">
        <h4 class="card-title-modern">Company Master</h4>
        <!-- <p class="text-muted small mb-0">Manage registered pump companies, tenant databases, and managers</p> -->
      </div>
      <div class="header-actions">
        <div class="search-container-modern">
          <input type="text" [(ngModel)]="searchTerm" (input)="searchData()" class="search-box-premium"
            placeholder="Search companies...">
          <button class="search-btn-premium" (click)="searchData()">
            <mat-icon>search</mat-icon>
          </button>
        </div>
        <button mat-flat-button color="primary" class="premium-btn-primary" (click)="addCompany()">
          <mat-icon>business</mat-icon>
          <span>Register New Company</span>
        </button>
      </div>
    </div>

    <div class="table-responsive-modern">
      <table class="modern-table">
        <thead>
          <tr>
            <th>Company Name</th>
            <th>Database Name</th>
            <th>Manager</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Status</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of companies | paginate: { itemsPerPage: 4, currentPage: currentPage }; trackBy: trackById">
            <td>
              <div class="user-cell">
                <div class="user-avatar">{{ item.name.charAt(0) | uppercase }}</div>
                <span class="font-weight-medium">{{ item.name }}</span>
              </div>
            </td>
            <td>
              <code
                style="background: rgba(15, 23, 42, 0.05); padding: 4px 8px; border-radius: 4px; color: #0f172a; font-family: monospace;">
                {{ item.database }}
              </code>
            </td>
            <td>{{ item.manager }}</td>
            <td>{{ item.email }}</td>
            <td>{{ item.phone }}</td>
            <td>
              <span class="status-pill" [class.success]="item.status === 'Active'"
                [class.info]="item.status !== 'Active'">
                {{ item.status }}
              </span>
            </td>
            <td class="text-center">
              <div class="action-buttons">
                <button mat-icon-button color="primary" (click)="editCompany(item)" title="Edit Company">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteCompany(item.id)" title="Delete Company">
                  <mat-icon>delete</mat-icon>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="card-footer-modern">
      <div class="pagination-info">
        Displaying {{ companies.length }} total companies
      </div>
      <pagination-controls (pageChange)="currentPage = $event" class="modern-pagination"></pagination-controls>
    </div>
  </div>
</div>
