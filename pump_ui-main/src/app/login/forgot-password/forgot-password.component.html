<div class="dialog-modern-container" style="width: 450px;">
  <div class="dialog-header-modern">
    <div class="header-main">
      <h4>
        <mat-icon class="text-primary">lock_reset</mat-icon>
        Reset Password
      </h4>
    </div>
    <button mat-icon-button (click)="close()" class="text-muted">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-content-modern py-2">
    <div class="text-center mb-2">
      <div class="icon-circle mb-2" style="background: rgba(16, 185, 129, 0.1); color: #10b981;">
        <mat-icon>security</mat-icon>
      </div>
      <p class="text-muted small mb-0">Enter your username or email address along with your new password to reset it directly.</p>
    </div>

    <div class="form-group-modern mb-3">
      <label class="form-label-modern">Username or Email</label>
      <div class="input-with-icon">
        <mat-icon>person_outline</mat-icon>
        <input type="text" class="form-control-modern" placeholder="Enter username or email" [(ngModel)]="identity">
      </div>
    </div>

    <div class="form-group-modern mb-3">
      <label class="form-label-modern">New Password</label>
      <div class="input-with-icon">
        <mat-icon>lock</mat-icon>
        <input [type]="showNewPass ? 'text' : 'password'" class="form-control-modern" placeholder="Enter new password" [(ngModel)]="newPass">
        <button type="button" class="password-toggle" (click)="showNewPass = !showNewPass">
          <mat-icon>{{ showNewPass ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
    </div>

    <div class="form-group-modern mb-3">
      <label class="form-label-modern">Confirm Password</label>
      <div class="input-with-icon">
        <mat-icon>check_circle</mat-icon>
        <input [type]="showConfirmPass ? 'text' : 'password'" class="form-control-modern" placeholder="Confirm new password" [(ngModel)]="confirmPass">
        <button type="button" class="password-toggle" (click)="showConfirmPass = !showConfirmPass">
          <mat-icon>{{ showConfirmPass ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="dialog-actions-modern pt-2">
    <button class="btn-premium btn-premium-secondary btn-md" (click)="close()">
      Cancel
    </button>
    
    <button class="btn-premium btn-premium-primary btn-md" (click)="resetPasswordDirect()" [disabled]="!identity || !newPass || !confirmPass">
      <mat-icon class="me-2">check_circle</mat-icon>
      Change Password
    </button>
  </div>
</div>
