<div class="dialog-modern-container" style="width: 450px;">
  <div class="dialog-header-modern">
    <div class="header-main">
      <h4>
        <mat-icon class="text-primary">vpn_key</mat-icon>
        Security Update Required
      </h4>
    </div>
    <button mat-icon-button (click)="close()" class="text-muted">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-content-modern py-4">
    <div class="text-center mb-4">
      <div class="icon-circle mb-3" style="background: rgba(251, 191, 36, 0.1); color: #fbbf24; display: inline-flex; align-items: center; justify-content: center; width: 60px; height: 60px; borderRadius: 50%;">
        <mat-icon style="font-size: 32px; width: 32px; height: 32px;">warning</mat-icon>
      </div>
      <p class="text-warning-dark font-weight-bold mb-1" style="font-weight: 600;">{{ message }}</p>
      <p class="text-muted small">Choose a strong password to secure your account. Password changes are logged for security audits.</p>
    </div>

    <div class="form-group-modern mb-3">
      <label class="form-label-modern">Current Password</label>
      <div class="input-with-icon" style="position: relative;">
        <mat-icon style="position: absolute; left: 12px; top: 12px; color: #9ca3af;">lock</mat-icon>
        <input type="password" class="form-control-modern" style="padding-left: 40px; width: 100%; height: 44px; border: 1px solid #e5e7eb; border-radius: 8px; outline: none;" placeholder="Enter current password" [(ngModel)]="oldPassword">
      </div>
    </div>

    <div class="form-group-modern mb-3">
      <label class="form-label-modern">New Password</label>
      <div class="input-with-icon" style="position: relative;">
        <mat-icon style="position: absolute; left: 12px; top: 12px; color: #9ca3af;">lock_open</mat-icon>
        <input type="password" class="form-control-modern" style="padding-left: 40px; width: 100%; height: 44px; border: 1px solid #e5e7eb; border-radius: 8px; outline: none;" placeholder="••••••••" [(ngModel)]="newPassword">
      </div>
    </div>

    <div class="form-group-modern mb-3">
      <label class="form-label-modern">Confirm New Password</label>
      <div class="input-with-icon" style="position: relative;">
        <mat-icon style="position: absolute; left: 12px; top: 12px; color: #9ca3af;">check_circle</mat-icon>
        <input type="password" class="form-control-modern" style="padding-left: 40px; width: 100%; height: 44px; border: 1px solid #e5e7eb; border-radius: 8px; outline: none;" placeholder="••••••••" [(ngModel)]="confirmPassword">
      </div>
    </div>
  </div>

  <div class="dialog-actions-modern" style="display: flex; justify-content: flex-end; gap: 12px; padding: 16px 0;">
    <button class="btn-premium btn-premium-secondary btn-md" (click)="close()">
      Cancel
    </button>
    <button class="btn-premium btn-premium-primary btn-md" (click)="changePassword()" [disabled]="!oldPassword || !newPassword || !confirmPassword">
      <mat-icon class="me-2" style="vertical-align: middle;">check_circle</mat-icon>
      Update Password
    </button>
  </div>
</div>
