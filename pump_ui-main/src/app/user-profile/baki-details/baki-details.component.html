<div class="row">
    <div class="col-sm-12 col-md-12 col-lg-12 col-xl-12">
        <div class="card">
            <div class="card-body">
                <div *ngIf="bakiList.length > 0">
                    <div class="button-group">
                        <button mat-raised-button (click)="exportExcel()">
                            <mat-icon>file_download</mat-icon>
                            Export to Excel
                        </button>
                        <button mat-raised-button (click)="pdf()">
                            <mat-icon>picture_as_pdf</mat-icon>
                            PDF
                        </button>
                        <button mat-raised-button (click)="cancel()">
                            <mat-icon>cancel</mat-icon>
                            Cancel
                        </button>
                    </div>

                    <table id="bakiListTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Name</th>
                                <th>Type</th>
                                <th>Rate</th>
                                <th>LTR</th>
                                <th>Baki</th>
                                <th>Note</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr *ngFor="let b of bakiList">
                                <td>{{ b[0] | date:'dd-MM-yyyy' }}</td>
                                <td>{{ b[1] }}</td>
                                <td>{{ b[2] }}</td>
                                <td>{{ b[3] }}</td>
                                <td>{{ b[4] }}</td>
                                <td>{{ b[5] }}</td>
                                <td>{{ b[6] }}</td>
                            </tr>
                        </tbody>
                    </table>

                </div>
                <div *ngIf="bakiList.length === 0">
                    No data available.
                </div>

            </div>
        </div>
    </div>
</div>
